name: Build Status

on:
  push:
    branches:
      - main
    tags:
      - v*
    paths-ignore:
      - LICENSE
      - README.md
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-24.04]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          - os: macos-26
            python-version: "3.11"
          - os: windows-2025
            python-version: "3.11"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions-ext/python/setup@c7ef9cbf13bc854a8d1422e9f8c6ee7a7ce1b911
        with:
          version: ${{ matrix.python-version }}

      - name: Setup C++
        uses: actions-ext/cpp/setup@7de57593fbcba72d513072bfb4b30b5a344aa547
        with:
          cache: 'false'
          clang_format: 'false'

      - name: Install dependencies
        run: make develop

      - name: Lint
        run: make lint
        if: runner.os == 'Linux'

      - name: Checks
        run: make checks
        if: runner.os == 'Linux'

      - name: Build
        run: make build

      - name: Test
        run: make coverage

      - name: Upload test results (Python)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.python-version }}
          path: junit.xml
        if: always()

      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@7622c5bf3d112a72ab4fa3951c2aa5723d8ab92d  # v2.25.0
        with:
          files: '**/junit.xml'
        if: runner.os == 'Linux'

      - name: Upload coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Build distributions
        run: make dist

      - name: Test wheel
        uses: actions-ext/python/test-wheel@c7ef9cbf13bc854a8d1422e9f8c6ee7a7ce1b911
        with:
          module: hatch_cpp

      - name: Test source distribution
        uses: actions-ext/python/test-sdist@c7ef9cbf13bc854a8d1422e9f8c6ee7a7ce1b911
        with:
          module: hatch_cpp

      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist-${{matrix.os}}
          path: dist

  pyodide:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions-ext/python/setup@c8228d827a81b9f8c808825328af361c45461ba3
        with:
          version: "3.14"

      - name: Install dependencies
        run: |
          make develop
          uv pip install pyodide-build==0.39.0

      - name: Build Pyodide fixture
        run: |
          mkdir -p dist/pyodide
          pyodide build hatch_cpp/tests/test_project_pyodide --outdir dist/pyodide --no-isolation --skip-dependency-check

      - name: Test in Pyodide
        run: |
          pyodide venv .venv-pyodide
          .venv-pyodide/bin/pip install dist/pyodide/*.whl
          .venv-pyodide/bin/python -c "from pyodide_project import answer; assert answer() == 42"
