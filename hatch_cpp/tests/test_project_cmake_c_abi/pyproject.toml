[build-system]
requires = ["hatchling>=1.20"]
build-backend = "hatchling.build"

[project]
name = "hatch-cpp-test-project-cmake-c-abi"
description = "CMake-built C ABI library validated by hatch-cpp"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "hatchling>=1.20",
    "hatch-cpp",
]

[tool.hatch.build]
artifacts = [
    "project/*.pyd",
    "project/*.so",
    "project/include/**/*.h",
    "project/lib/*.dll",
    "project/lib/*.dylib",
    "project/lib/*.json",
    "project/lib/*.lib",
    "project/lib/*.so",
]

[tool.hatch.build.sources]
src = "/"

[tool.hatch.build.targets.sdist]
packages = ["project"]

[tool.hatch.build.targets.wheel]
packages = ["project"]

[tool.hatch.build.hooks.hatch-cpp]
verbose = true
artifact-manifest = true
artifact-manifest-destination = "project/lib/hatch-cpp-artifacts.json"

[tool.hatch.build.hooks.hatch-cpp.cmake]
root = "CMakeLists.txt"
include_flags = {"python_version" = true}

# No path: hatch-cpp finds the one packaged libdemo.so, libdemo.dylib, or demo.dll.
[[tool.hatch.build.hooks.hatch-cpp.artifacts]]
name = "demo"
expected-headers = ["project/include/demo/demo.h"]
header-symbol-prefix = "demo_"
expected-abi-strings = ["DEMO_ABI_VERSION 1"]
